[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hack-hedera"
version = "0.1.0"
description = "Hedera Agent Commerce Kit — pay-per-request infrastructure for AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "httpx>=0.27.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "reportlab>=4.2.0",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
hedera = [
    # hedera-agent-kit requires Python <3.14; install manually if available
    # "hedera-agent-kit>=0.1.2",
    # hiero-sdk-python 0.2.9+ supports Python 3.14 (without version pin)
    "hiero-sdk-python",
]
langchain = [
    "langchain>=0.3.25",
    "langchain-core>=0.3.60",
    "langgraph>=0.2.60",
    "langchain-openai>=0.3.19",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["hack"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
